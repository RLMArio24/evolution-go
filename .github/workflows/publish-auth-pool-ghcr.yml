name: Publish validated auth pool image to GHCR

on:
  push:
    branches: [release/auth-pool-ghcr-20261014]
    paths: [.github/workflows/publish-auth-pool-ghcr.yml]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-auth-pool-e899df4
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'RLMArio24/evolution-go' && github.ref == 'refs/heads/release/auth-pool-ghcr-20261014'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_REVISION: e899df4a6dc8ea4ea241c4ad53ff9c862cae2757
      IMAGE_NAME: ghcr.io/rlmario24/evolution-go
      IMAGE_TAG: 0.7.2-auth-pool-e899df4
    steps:
      - name: Checkout validated source
        uses: actions/checkout@v4
        with:
          repository: RLMArio24/evolution-go
          ref: e899df4a6dc8ea4ea241c4ad53ff9c862cae2757
          persist-credentials: false
      - name: Verify source revision
        run: test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR with ephemeral workflow token
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish validated image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/rlmario24/evolution-go:0.7.2-auth-pool-e899df4
          build-args: VERSION=0.7.2+auth-pool.e899df4
          labels: |
            org.opencontainers.image.source=https://github.com/RLMArio24/evolution-go
            org.opencontainers.image.revision=e899df4a6dc8ea4ea241c4ad53ff9c862cae2757
            org.opencontainers.image.version=0.7.2+auth-pool.e899df4
      - name: Record immutable deployment reference
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test -n "$IMAGE_DIGEST"
          printf 'Published image: %s:%s\nSource revision: %s\nDeployment reference: %s@%s\n' "$IMAGE_NAME" "$IMAGE_TAG" "$SOURCE_REVISION" "$IMAGE_NAME" "$IMAGE_DIGEST" | tee -a "$GITHUB_STEP_SUMMARY"
